name: topaz
# libtopaz-gl.dylib, libtopaz-inject.dylib and the backboardd wrapper (GPU rendering for the window server).
# Run by hand (Actions -> topaz -> Run workflow). The result is the artifact "topaz-ios".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          bash userland/gpu/mk-topaz-ci.sh 2>&1 | tee topaz-build.log
      - name: Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topaz-log
          path: topaz-build.log
      - name: Result
        uses: actions/upload-artifact@v4
        with:
          name: topaz-ios
          path: build-topaz/out/
